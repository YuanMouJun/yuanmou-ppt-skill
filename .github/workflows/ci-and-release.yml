name: CI & Release Asset Guard

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify manifest consistency, run tests & audit dual ZIP bundles
        run: |
          node scripts/release.mjs --verify-only --no-sync-stage
          git diff --exit-code -- skills/yuanmou-ppt/skill-manifest.json skills/yuanmou-ppt/SKILL.md skills/yuanmou-ppt/packages/pptx-kit/src/updater.mjs

      - name: Ensure yuanmou-ppt-skill.zip is attached on Release / Tag & purge CDN
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            HAS_ZIP=$(gh release view "$TAG_NAME" --json assets --jq '.assets[] | select(.name=="yuanmou-ppt-skill.zip") | .name' || true)
            if [ -z "$HAS_ZIP" ]; then
              gh release upload "$TAG_NAME" dist/yuanmou-ppt-skill.zip
            else
              echo "Verified yuanmou-ppt-skill.zip already attached to $TAG_NAME (preserving download count)."
            fi
          else
            gh release create "$TAG_NAME" dist/yuanmou-ppt-skill.zip --title "$TAG_NAME" --generate-notes --latest
          fi
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/skills/yuanmou-ppt/skill-manifest.json" || true
