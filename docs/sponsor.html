<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赞赏支持 · yuanmou-ppt</title>
  <meta name="description" content="如果 yuanmou-ppt 帮你省下了熬夜改 PPT 的时间，欢迎请作者喝杯咖啡，支持开源引擎与 1.6W+ 商业版式库持续维护。" />
  <meta name="theme-color" content="#F7F5F0" />
  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --ink: #141518;
      --ink-2: #52555E;
      --ink-3: #858891;
      --accent: #D9480F;
      --line: #E4E1D9;
      --wechat: #07C160;
      --alipay: #1677FF;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    .nav {
      border-bottom: 1px solid var(--line);
      background: rgba(247, 245, 240, 0.9);
      backdrop-filter: blur(10px);
    }
    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 16px;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--ink);
      color: #FFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .nav-back {
      font-size: 13.5px;
      color: var(--ink-2);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-back:hover { color: var(--accent); }

    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 24px 84px;
      text-align: center;
    }
    .kicker {
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(28px, 4.5vw, 40px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    .sub {
      max-width: 560px;
      margin: 0 auto 44px;
      font-size: 15.5px;
      line-height: 1.75;
      color: var(--ink-2);
    }

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin-bottom: 36px;
    }
    .qr-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px 24px;
      box-shadow: 0 12px 36px rgba(20, 21, 24, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .qr-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .qr-badge.wechat { background: rgba(7, 193, 96, 0.11); color: #059648; }
    .qr-badge.alipay { background: rgba(22, 119, 255, 0.10); color: #1261D8; }
    .qr-dot { width: 8px; height: 8px; border-radius: 50%; }
    .wechat .qr-dot { background: var(--wechat); }
    .alipay .qr-dot { background: var(--alipay); }

    .qr-box {
      width: 248px;
      height: 248px;
      padding: 10px;
      background: #FFFFFF;
      border: 1px solid #EFECE6;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .qr-tip {
      font-size: 13px;
      color: var(--ink-3);
    }

    .note-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 26px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .note-box > div { flex: 1; min-width: 260px; }
    .note-box h3 { font-size: 15px; margin-bottom: 6px; }
    .note-box p { font-size: 13.5px; color: var(--ink-2); line-height: 1.65; }
    .note-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 9px;
      background: var(--ink);
      color: #FFF;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .note-btn:hover { background: var(--accent); }

    footer {
      border-top: 1px solid var(--line);
      padding: 22px 24px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-3);
    }
    footer a { color: var(--ink-2); text-decoration: none; margin: 0 10px; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 680px) {
      .qr-grid { grid-template-columns: 1fr; }
      main { padding: 44px 18px 64px; }
      .qr-box { width: 220px; height: 220px; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="./" class="brand">
        <span class="brand-mark">渊</span>
        <span>yuanmou-ppt</span>
      </a>
      <a href="./" class="nav-back">← 返回官网首页</a>
    </div>
  </header>

  <main>
    <div class="kicker">SPONSOR · 赞赏支持</div>
    <h1>请作者喝杯咖啡</h1>
    <p class="sub">
      <code>yuanmou-ppt-skill</code> 核心原生 OOXML 引擎永久开源免费（Apache-2.0）。如果它帮你省下了凌晨改 PPT 的时间，欢迎随心赞赏，全部用于开源引擎维护与 1.6W+ 免费版式库 CDN 带宽。
    </p>

    <div class="qr-grid">
      <div class="qr-card">
        <div class="qr-badge wechat"><span class="qr-dot"></span>微信赞赏</div>
        <div class="qr-box">
          <img src="./assets/qr-wechat.png" alt="微信支付赞赏码" />
        </div>
        <div class="qr-tip">打开微信扫一扫 · 金额随意，心意无价</div>
      </div>

      <div class="qr-card">
        <div class="qr-badge alipay"><span class="qr-dot"></span>支付宝赞赏</div>
        <div class="qr-box">
          <img src="./assets/qr-alipay.png" alt="支付宝赞赏码" />
        </div>
        <div class="qr-tip">打开支付宝扫一扫 · 零平台抽成直达作者</div>
      </div>
    </div>
  </main>

  <footer>
    <span>© 2026 渊眸策略 · yuanmou-ppt-skill</span>
    <a href="./">官网首页</a>
    <a href="https://github.com/YuanMouJun/yuanmou-ppt-skill" target="_blank" rel="noopener">GitHub</a>
  </footer>
</body>
</html>
